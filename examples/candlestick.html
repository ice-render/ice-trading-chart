<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-trading-chart · 交易图表</title>
    <style>
      :root {
        --bg: #0b0f16;
        --panel: #121821;
        --panel-2: #0e141c;
        --line: #1e2733;
        --text: #dfe7ef;
        --dim: #8a97a6;
        --muted: #5c6a7a;
        --accent: #3b82f6;
        --up: #f04438;
        --down: #12b76a;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Roboto Mono', monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 var(--font);
      }
      .wrap { max-width: 1240px; margin: 0 auto; }
      header.bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 12px;
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid var(--line);
        border-bottom: none;
      }
      .quote { display: flex; align-items: baseline; gap: 10px; margin-left: auto; }
      .quote .last { font: 600 22px/1 var(--mono); letter-spacing: 0.5px; }
      .quote .chg { font: 500 13px/1 var(--mono); }
      .quote .sep { color: var(--muted); }
      .quote .meta { font: 11px/1 var(--mono); color: var(--dim); }
      .tools { display: flex; align-items: center; gap: 8px; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
      .seg button {
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: var(--dim);
        padding: 4px 9px;
        font: 500 12px/1.4 var(--mono);
        cursor: pointer;
      }
      .seg button:last-child { border-right: 0; }
      .seg button:hover { color: var(--text); background: rgba(59, 130, 246, 0.08); }
      .seg button.on { color: #fff; background: rgba(59, 130, 246, 0.22); }
      .tools > button {
        background: #161d28;
        border: 1px solid #2a3646;
        border-radius: 4px;
        color: #a8b4c2;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .tools > button:hover { color: var(--text); border-color: var(--accent); }
      .tools > button:active { background: rgba(59, 130, 246, 0.18); }

      .stage { position: relative; border: 1px solid var(--line); border-top: none; background: var(--panel-2); }
      canvas { display: block; max-width: 100%; }

      /* 图表外壳：HTML 覆盖层。全部 pointer-events:none，指针事件要能穿透到画布 */
      .chrome { position: absolute; inset: 0; pointer-events: none; font-family: var(--mono); }
      .chrome > * { position: absolute; }
      .ohlc { display: flex; gap: 10px; font-size: 12px; white-space: nowrap; }
      .ohlc .sym { color: var(--text); font-weight: 600; }
      .ohlc .kv { color: var(--muted); }
      .ohlc .kv b { font-weight: 500; color: var(--dim); }
      .hline {
        height: 0;
        border-top: 1px dashed rgba(138, 151, 166, 0.55);
        left: 0;
        width: 0;
      }
      .lastline { height: 0; border-top: 1px dashed var(--accent); left: 0; width: 0; }
      .tag {
        font: 500 11px/1 var(--mono);
        padding: 3px 5px;
        border-radius: 2px;
        white-space: nowrap;
        text-align: center;
        overflow: hidden;
      }
      .tag.price { background: rgba(138, 151, 166, 0.92); color: #0b0f16; }
      .tag.last { color: #fff; }
      .tag.time { background: rgba(138, 151, 166, 0.92); color: #0b0f16; }

      footer.status {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-top: none;
        background: var(--panel);
        font: 11px/1.6 var(--mono);
        color: var(--dim);
      }
      footer.status b { color: var(--text); font-weight: 500; }
      .log { margin-left: auto; color: var(--muted); white-space: nowrap; overflow: hidden; max-width: 46%; }
      .lead { color: var(--dim); margin: 12px 2px 0; font-size: 12px; }
      .lead code { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <div class="tools">
          <div class="seg" id="seg-interval">
            <button data-interval="1m">1m</button>
            <button data-interval="5m">5m</button>
            <button data-interval="15m" class="on">15m</button>
            <button data-interval="1H">1H</button>
            <button data-interval="4H">4H</button>
            <button data-interval="1D">1D</button>
          </div>
          <button id="btn-scheme">涨色：红</button>
          <button id="btn-toggle">暂停</button>
          <button id="btn-reset">重置</button>
        </div>
        <div class="quote">
          <span class="last" id="q-last">-</span>
          <span class="chg" id="q-chg">-</span>
          <span class="sep">|</span>
          <span class="meta" id="q-meta">-</span>
        </div>
      </header>

      <div class="stage" id="stage">
        <canvas id="chart" width="1200" height="540"></canvas>
        <div class="chrome" id="chrome">
          <div class="ohlc" id="ohlc">
            <span class="sym" id="o-sym">K 线</span>
            <span class="kv">开 <b id="o-open">-</b></span>
            <span class="kv">高 <b id="o-high">-</b></span>
            <span class="kv">低 <b id="o-low">-</b></span>
            <span class="kv">收 <b id="o-close">-</b></span>
            <span class="kv">量 <b id="o-vol">-</b></span>
            <span class="kv" id="o-chg">-</span>
            <span class="kv" id="o-time">-</span>
          </div>
          <div class="hline" id="hline"></div>
          <div class="lastline" id="lastline"></div>
          <div class="tag price" id="ptag">-</div>
          <div class="tag last" id="ltag">-</div>
          <div class="tag time" id="xtag">-</div>
        </div>
      </div>

      <footer.status">
        <span>收盘倒计时 <b id="s-countdown">--:--</b></span>
        <span>下一根 <b id="s-next">-</b></span>
        <span>已推送 <b id="s-ticks">0</b></span>
        <span>fps <b id="s-fps">0</b></span>
        <span class="log" id="log">悬停看十字光标与抬头</span>
      </footer>

      <p class="lead">
        一根 K 线是 <code>{ x, o, c, l, h, v }</code>：四个价由系列组件自己解析，影线（low / high）会进价格轴范围；
        成交量走<b>第二个 y 轴</b>并压到绘图区底部（轴域钉成 <code>[0, 5×最大量]</code>）；
        最新价线、右侧价签、左上角抬头与十字光标横线由本页的 HTML 覆盖层画，位置取自
        <code>plotRect()</code> / <code>priceToY()</code> / <code>yToPrice()</code> 这些公开投影。
      </p>
    </div>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../node_modules/@damoqiongqiu/ice-chart/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      class TradingChartPage {
        /**
         * 各周期的采样条数与步长。
         *
         * ⚠️ 类目轴的类目是**按字符串去重**的（`buildCategoryValues` 用 `String(value)` 做键），
         * 所以「同一个标签出现两次」会让两根 K 线塌缩到同一个类目上、后面所有命中判定跟着乱。
         * 多天数据的标签必须带日期 —— 见 `labelOf`。
         */
        static INTERVALS = {
          '1m': { ms: 60e3, count: 120 },
          '5m': { ms: 5 * 60e3, count: 144 },
          '15m': { ms: 15 * 60e3, count: 95 },
          '1H': { ms: 3600e3, count: 120 },
          '4H': { ms: 4 * 3600e3, count: 90 },
          '1D': { ms: 86400e3, count: 90 },
        };
        static PALETTES = {
          redUp: { up: '#f04438', down: '#12b76a', label: '涨色：红' },
          greenUp: { up: '#12b76a', down: '#f04438', label: '涨色：绿' },
        };
        static HEIGHT = 540;
        static TICK_MS = 700;
        static TICKS_PER_BAR = 4;
        static BASE_PRICE = 42000;
        static VOL_MIN = 600;
        static VOL_SPAN = 2600;

        static round2(value) {
          return Math.round(value * 100) / 100;
        }

        static pad2(value) {
          return String(value).padStart(2, '0');
        }

        candles = [];
        chart = null;
        readout = null;
        running = true;
        timer = null;
        intervalKey = '15m';
        schemeKey = 'redUp';
        price = TradingChartPage.BASE_PRICE;
        ticksInBar = 0;
        pushed = 0;
        pointer = null;
        chromeSig = '';
        frames = 0;
        fpsAt = 0;

        constructor() {
          this.seed();
          this.mount();
          this.bindToolbar();
          this.bindPointer();
          this.syncChrome(true);
          this.timer = setInterval(() => this.step(), TradingChartPage.TICK_MS);
          this.fpsAt = performance.now();
        }

        get interval() {
          return TradingChartPage.INTERVALS[this.intervalKey];
        }

        get palette() {
          return TradingChartPage.PALETTES[this.schemeKey];
        }

        get option() {
          return {
            legend: { show: false },
            theme: 'dark',
            // 抬头已经给出同一份读数，关掉引擎的浮动提示框（浮动框会压在蜡烛上，也不像交易终端）
            tooltip: { show: false },
            // 引擎的十字光标只保留竖线；横线 / 价签 / 横轴标签由本页覆盖层画，
            // 因为引擎的 y 标签固定画在绘图区**左**边缘，而价格轴在右边。
            crosshair: { show: true, axis: 'x', showAxisLabel: false },
            animation: { enabled: false },
            xAxis: { type: 'category' },
            yAxis: { position: 'right' },
            volume: { ratio: 5 },
            series: [
              {
                id: 'k',
                type: 'candlestick',
                name: 'K 线',
                data: this.candles,
                barWidth: 0.66,
                candle: { upColor: this.palette.up, downColor: this.palette.down, borderWidth: 1 },
              },
            ],
          };
        }

        get extras() {
          return { priceLabels: { open: '开', high: '高', low: '低', close: '收', volume: '量' } };
        }

        seed() {
          const interval = this.interval;
          const now = Date.now();
          this.candles = [];
          this.price = TradingChartPage.BASE_PRICE;
          this.ticksInBar = 0;
          this.pushed = 0;
          for (let i = 0; i < interval.count; i++) {
            this.candles.push(this.makeBar(now - (interval.count - 1 - i) * interval.ms));
          }
        }

        makeBar(at) {
          const open = this.price;
          const close = open + (Math.random() - 0.5) * open * 0.0022;
          const high = Math.max(open, close) + Math.random() * open * 0.001;
          const low = Math.min(open, close) - Math.random() * open * 0.001;
          this.price = close;
          return {
            at,
            x: this.labelOf(at),
            o: TradingChartPage.round2(open),
            c: TradingChartPage.round2(close),
            l: TradingChartPage.round2(low),
            h: TradingChartPage.round2(high),
            v: Math.round(TradingChartPage.VOL_MIN + Math.random() * TradingChartPage.VOL_SPAN),
          };
        }

        /**
         * 类目标签，**必须逐根唯一**：类目轴的类目按字符串去重，
         * 跨天的数据只写 `HH:MM` 会把不同天的同一时刻合并成一个类目。
         * 所以跨度 ≥ 24h 时带上日期。
         */
        labelOf(at) {
          const interval = this.interval;
          const date = new Date(at);
          const day = `${TradingChartPage.pad2(date.getMonth() + 1)}-${TradingChartPage.pad2(date.getDate())}`;
          if (interval.ms >= 86400e3) return day;
          const clock = `${TradingChartPage.pad2(date.getHours())}:${TradingChartPage.pad2(date.getMinutes())}`;
          return interval.count * interval.ms >= 86400e3 ? `${day} ${clock}` : clock;
        }

        mount() {
          this.chart = ICETradingChart.createTradingChart('chart', this.option, this.extras);
          this.readout = ICETradingChart.createOhlcReadout(this.chart, { volume: { ratio: 5 } });
          this.chart.on('item:hover', () => this.syncChrome());
          this.chart.on('item:leave', () => this.syncChrome());
          this.chart.on('zoom:change', () => this.afterViewChange());
          this.chart.on('pan:change', () => this.afterViewChange());
          this.resize();
          window.addEventListener('resize', () => this.resize());
        }

        /** setOption 是**整体替换**，所以每次都要给完整 option（顺带把两个轴域重新钉一遍）。 */
        onUpdate() {
          if (!this.chart) return;
          this.chart.setOption(ICETradingChart.toTradingOption(this.option, this.extras), {
            animate: false,
            preserveView: true,
          });
        }

        afterViewChange() {
          this.chromeSig = '';
          this.syncChrome();
        }

        bindToolbar() {
          const seg = document.getElementById('seg-interval');
          seg.addEventListener('click', (event) => {
            const key = event.target && event.target.getAttribute && event.target.getAttribute('data-interval');
            if (!key || key === this.intervalKey) return;
            this.intervalKey = key;
            for (const button of seg.querySelectorAll('button')) {
              button.classList.toggle('on', button.getAttribute('data-interval') === key);
            }
            this.seed();
            this.rebuild();
          });
          document.getElementById('btn-scheme').addEventListener('click', () => this.toggleScheme());
          document.getElementById('btn-toggle').addEventListener('click', () => this.toggleRunning());
          document.getElementById('btn-reset').addEventListener('click', () => {
            this.seed();
            this.rebuild();
            this.write('已重置');
          });
        }

        bindPointer() {
          const canvas = document.getElementById('chart');
          canvas.addEventListener('pointermove', (event) => {
            const rect = canvas.getBoundingClientRect();
            this.pointer = { x: event.clientX - rect.left, y: event.clientY - rect.top };
            this.syncChrome();
          });
          canvas.addEventListener('pointerleave', () => {
            this.pointer = null;
            this.syncChrome();
          });
        }

        /**
         * 尺寸对齐交给引擎（`chart.resize` 内部处理 dpr / 边框 / 命中矩形，只有一份实现）。
         * 宽度从 stage 的**内容盒**量：`clientWidth` 已排除边框，正是画布的逻辑宽度。
         */
        resize() {
          const stage = document.getElementById('stage');
          const width = Math.max(320, Math.round(stage.clientWidth));
          this.chart.resize(width, TradingChartPage.HEIGHT);
          this.chromeSig = '';
          this.syncChrome();
        }

        rebuild() {
          this.chart.setOption(ICETradingChart.toTradingOption(this.option, this.extras), {
            animate: 'enter',
            preserveView: false,
          });
          this.chromeSig = '';
          this.syncChrome();
        }

        step() {
          if (!this.running) return;
          this.tick();
        }

        tick() {
          const interval = this.interval;
          const last = this.candles[this.candles.length - 1];
          const next = this.price + (Math.random() - 0.5) * this.price * 0.0014;
          this.price = next;
          last.c = TradingChartPage.round2(next);
          last.h = TradingChartPage.round2(Math.max(last.h, next));
          last.l = TradingChartPage.round2(Math.min(last.l, next));
          last.v += Math.round(30 + Math.random() * 180);
          this.pushed += 1;
          this.ticksInBar += 1;
          if (this.ticksInBar >= TradingChartPage.TICKS_PER_BAR) {
            this.ticksInBar = 0;
            this.candles.push(this.makeBar(last.at + interval.ms));
            if (this.candles.length > interval.count) this.candles.shift();
          }
          this.onUpdate();
          this.syncChrome();
        }

        toggleRunning() {
          this.running = !this.running;
          document.getElementById('btn-toggle').textContent = this.running ? '暂停' : '继续';
        }

        toggleScheme() {
          this.schemeKey = this.schemeKey === 'redUp' ? 'greenUp' : 'redUp';
          document.getElementById('btn-scheme').textContent = this.palette.label;
          this.onUpdate();
          this.chromeSig = '';
          this.syncChrome();
        }

        countdown() {
          const interval = this.interval;
          const now = Date.now();
          const remaining = Math.max(0, Math.ceil(now / interval.ms) * interval.ms - now);
          const total = Math.floor(remaining / 1000);
          const mm = String(Math.floor(total / 60)).padStart(2, '0');
          const ss = String(total % 60).padStart(2, '0');
          return `${mm}:${ss}`;
        }

        onFrame(now) {
          this.frames += 1;
          if (now - this.fpsAt >= 500) {
            document.getElementById('s-fps').textContent = String(Math.round((this.frames / (now - this.fpsAt)) * 1000));
            this.frames = 0;
            this.fpsAt = now;
            document.getElementById('s-countdown').textContent = this.countdown();
            document.getElementById('s-ticks').textContent = String(this.pushed);
            const last = this.candles[this.candles.length - 1];
            document.getElementById('s-next').textContent = this.labelOf(last.at + this.interval.ms);
          }
          this.syncChrome();
        }

        /** 外壳同步：只在几何签名变化时写 DOM（每帧无条件写会掉帧）。 */
        syncChrome(force) {
          if (!this.chart) return;
          const rect = ICETradingChart.plotRect(this.chart);
          if (!rect) return;
          const reading = this.readout.read();
          const last = this.candles[this.candles.length - 1];
          const lastY = ICETradingChart.priceToY(this.chart, last.c, 0);
          const pointerY = this.pointer ? this.pointer.y : null;
          const sig = [
            rect.x, rect.y, rect.width, rect.height,
            reading ? `${reading.index}:${reading.close}` : '-',
            last.c, pointerY, this.schemeKey, this.intervalKey,
          ].join('|');
          if (!force && sig === this.chromeSig) return;
          this.chromeSig = sig;

          this.paintHeader(reading);
          this.paintLast(rect, last, lastY);
          this.paintPointer(rect, pointerY);
          this.paintQuote(reading, last);
        }

        paintHeader(reading) {
          const format = ICETradingChart.formatPrice;
          const set = (id, text, color) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            if (color) el.style.color = color;
          };
          if (!reading) return;
          const color = reading.rising ? this.palette.up : this.palette.down;
          set('o-open', format(reading.open));
          set('o-high', format(reading.high));
          set('o-low', format(reading.low));
          set('o-close', format(reading.close));
          set('o-vol', reading.volume === null ? '-' : ICETradingChart.formatVolume(reading.volume));
          set('o-chg', `${ICETradingChart.formatSigned(reading.change)} ${ICETradingChart.formatPct(reading.changePct)}`, color);
          set('o-time', String(reading.xValue));
        }

        paintLast(rect, last, lastY) {
          if (lastY === null) return;
          const color = last.c >= last.o ? this.palette.up : this.palette.down;
          const line = document.getElementById('lastline');
          line.style.left = `${rect.x}px`;
          line.style.width = `${rect.width}px`;
          line.style.top = `${lastY}px`;
          line.style.borderTopColor = color;
          const tag = document.getElementById('ltag');
          const box = this.tagBox(rect);
          tag.style.left = `${box.left}px`;
          tag.style.width = `${box.width}px`;
          tag.style.top = `${lastY - 9}px`;
          tag.style.background = color;
          tag.textContent = ICETradingChart.formatPrice(last.c);
        }

        paintPointer(rect, pointerY) {
          const hline = document.getElementById('hline');
          const ptag = document.getElementById('ptag');
          const xtag = document.getElementById('xtag');
          const price = pointerY === null ? null : ICETradingChart.yToPrice(this.chart, pointerY, 0);
          const inside = pointerY !== null && price !== null && pointerY >= rect.y && pointerY <= rect.y + rect.height;
          hline.style.display = inside ? 'block' : 'none';
          ptag.style.display = inside ? 'block' : 'none';
          if (inside) {
            hline.style.left = `${rect.x}px`;
            hline.style.width = `${rect.width}px`;
            hline.style.top = `${pointerY}px`;
            const box = this.tagBox(rect);
            ptag.style.left = `${box.left}px`;
            ptag.style.width = `${box.width}px`;
            ptag.style.top = `${pointerY - 9}px`;
            // yToPrice 是纯反投影，会带出浮点噪声（如 42050.000012）；按报价精度收一下再显示
            ptag.textContent = ICETradingChart.formatPrice(TradingChartPage.round2(price));
          }
          const hover = this.chart.controller && this.chart.controller.hover;
          const column = hover && hover.kind === 'axis' ? hover.column : null;
          if (column) {
            const x = column.pixelX;
            xtag.style.display = 'block';
            xtag.style.left = `${x - 26}px`;
            xtag.style.width = '52px';
            xtag.style.top = `${rect.y + rect.height + 3}px`;
            xtag.textContent = String(column.xValue);
          } else {
            xtag.style.display = 'none';
          }
        }

        paintQuote(reading, last) {
          const rising = last.c >= last.o;
          const color = rising ? this.palette.up : this.palette.down;
          const el = document.getElementById('q-last');
          el.textContent = ICETradingChart.formatPrice(last.c);
          el.style.color = color;
          const chg = document.getElementById('q-chg');
          if (reading) {
            chg.textContent = `${ICETradingChart.formatSigned(reading.change)} ${ICETradingChart.formatPct(reading.changePct)}`;
            chg.style.color = reading.rising ? this.palette.up : this.palette.down;
          }
          document.getElementById('q-meta').textContent = `${this.intervalKey} · ${this.labelOf(last.at)} · ${this.candles.length} 根`;
        }

        /** 右侧价签的位置与宽度：贴着绘图区右边缘，但绝不越出画布。 */
        tagBox(rect) {
          const canvasWidth = this.canvasWidth();
          const left = rect.x + rect.width + 2;
          const width = Math.max(40, Math.min(96, canvasWidth - left - 2));
          return { left, width };
        }

        canvasWidth() {
          return document.getElementById('chart').getBoundingClientRect().width;
        }

        write(line) {
          const log = document.getElementById('log');
          log.textContent = line;
        }
      }

      const page = new TradingChartPage();
      const frame = (now) => {
        page.onFrame(now);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
      window.__page = page;
    </script>
  </body>
</html>
